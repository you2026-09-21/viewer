<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>個人用ページ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F3F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viewer">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#F5F6F8;--fg:#1F2328;--muted:#6B7280;--line:#D9DDE3;--btn:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#16181C;--fg:#E6E8EB;--muted:#9AA1AB;--line:#30343B;--btn:#1F2227;color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.gate[hidden]{display:none}
.lead{color:var(--muted);font-size:14px;margin:0;max-width:340px}
.fine{color:var(--muted);font-size:12px;margin:8px 0 0;max-width:340px}
.gate h1{font-size:18px;font-weight:600;margin:0}
.gate button{height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--line);background:var(--btn);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.gate button:focus-visible{outline:2px solid #2F6FB0;outline-offset:2px}
#msg{min-height:1.5em;color:var(--muted);font-size:13px;margin:0;max-width:320px}
</style>
</head>
<body>
<main class="gate" id="gate" hidden>
  <h1>個人用ページ</h1>
  <p class="lead">持ち主だけが使う個人用のページです。ほかの方向けの内容はありません。</p>
  <button id="go">開く（持ち主専用）</button>
  <p id="msg" role="status"></p>
  <p class="fine">持ち主は、Google公式のログイン画面から自分のアカウントで開きます。このページがパスワードを求めたり、保存したりすることはありません。</p>
</main>
<script>
(function(){
"use strict";
var CLIENT_ID = "526704452239-66go6i7f7pqtgt1mveg9n3u3g9ddi99c.apps.googleusercontent.com";
var SCOPE = "https://www.googleapis.com/auth/drive.appdata";
var FILES = "https://www.googleapis.com/drive/v3/files";
var DB = "v-cache", MAX_IDLE = 7 * 24 * 3600 * 1000;

/* local cache */
var dbp = null;
function db(){
  if(!dbp) dbp = new Promise(function(res, rej){
    var r = indexedDB.open(DB, 1);
    r.onupgradeneeded = function(){ var d = r.result; ["kv", "thumbs", "full"].forEach(function(n){ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
  });
  return dbp;
}
function idb(store, mode, fn){
  return db().then(function(d){
    return new Promise(function(res, rej){ var t = d.transaction(store, mode); var q = fn(t.objectStore(store)); t.oncomplete = function(){ res(q && q.result); }; t.onerror = function(){ rej(t.error); }; });
  }).catch(function(){ return null; });
}
function kvGet(k){ return idb("kv", "readonly", function(s){ return s.get(k); }); }
function kvSet(k, v){ return idb("kv", "readwrite", function(s){ return s.put(v, k); }); }
function wipe(){
  return db().then(function(d){ d.close(); }).catch(function(){}).then(function(){
    dbp = null;
    return new Promise(function(res){ var r = indexedDB.deleteDatabase(DB); r.onsuccess = r.onerror = r.onblocked = function(){ res(); }; });
  });
}

/* sign-in */
var token = null, tokenExp = 0, client = null, pending = null;
function init(){
  if(client) return true;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
  client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE,
    callback: function(r){ var p = pending; pending = null;
      if(r && r.access_token){ token = r.access_token; tokenExp = Date.now() + ((+r.expires_in || 3600) - 120) * 1000; kvSet("tok", { t: token, e: tokenExp }); if(p) p.res(token); }
      else if(p) p.rej(new Error("ログインできませんでした。もう一度お試しください。")); },
    error_callback: function(){ var p = pending; pending = null; if(p) p.rej(new Error("ログインが取りやめられました。")); }
  });
  return true;
}
function requestToken(prompt){
  return new Promise(function(res, rej){
    if(!init()){ rej(new Error("ログインの準備ができませんでした。通信状態を確認して、もう一度お試しください。")); return; }
    pending = { res: res, rej: rej };
    client.requestAccessToken({ prompt: prompt || "" });
  });
}
function hasToken(){ return !!token && Date.now() < tokenExp; }
function ensureToken(){ return hasToken() ? Promise.resolve(token) : requestToken(""); }
function api(url, as){
  return ensureToken().then(function(){ return fetch(url, { headers: { Authorization: "Bearer " + token } }); })
    .then(function(r){
      if(r.status === 401){ token = null; kvSet("tok", null); return requestToken("").then(function(){ return fetch(url, { headers: { Authorization: "Bearer " + token } }); }); }
      return r;
    }).then(function(r){
      if(!r.ok) throw new Error("読み込めませんでした（" + r.status + "）。");
      return as === "blob" ? r.blob() : as === "text" ? r.text() : r.json();
    });
}

/* app code lives in the signed-in user's own storage */
function fetchCode(){
  return api(FILES + "?spaces=appDataFolder&q=" + encodeURIComponent("name='viewer.js'") + "&fields=files(id,modifiedTime)").then(function(j){
    var f = (j.files || [])[0];
    if(!f) throw new Error("まだ表示できる内容がありません。");
    return api(FILES + "/" + f.id + "?alt=media", "text").then(function(text){
      return kvSet("code", { text: text, mt: f.modifiedTime }).then(function(){ return text; });
    });
  });
}
var gate = document.getElementById("gate"), msg = document.getElementById("msg");
var env = {
  api: api, hasToken: hasToken, ensureToken: ensureToken, idb: idb, kvGet: kvGet, kvSet: kvSet,
  showGate: function(m){ gate.hidden = false; msg.textContent = m || ""; },
  hideGate: function(){ gate.hidden = true; msg.textContent = ""; },
  checkCode: function(f){
    kvGet("code").then(function(c){
      if(c && f && c.mt !== f.modifiedTime) api(FILES + "/" + f.id + "?alt=media", "text").then(function(text){ kvSet("code", { text: text, mt: f.modifiedTime }); }).catch(function(){});
    });
  }
};
var started = false;
function run(text){
  if(started) return; started = true;
  try{ new Function("env", text)(env); }
  catch(e){ started = false; env.showGate("開けませんでした。もう一度ログインしてください。"); }
}
document.getElementById("go").addEventListener("click", function(){
  msg.textContent = "";
  requestToken("select_account").then(fetchCode).then(run).catch(function(e){ msg.textContent = e.message; });
});

/* clear everything if not opened for 7 days */
kvGet("lastOpen").then(function(last){
  return (last && Date.now() - last > MAX_IDLE) ? wipe() : null;
}).then(function(){
  return kvSet("lastOpen", Date.now());
}).then(function(){
  /* keep the short-lived pass (about an hour) so reopening doesn't need a new sign-in */
  return kvGet("tok");
}).then(function(t){
  if(t && t.t && t.e > Date.now()){ token = t.t; tokenExp = t.e; }
  return kvGet("code");
}).then(function(c){
  if(c && c.text) run(c.text); else gate.hidden = false;
});
})();
</script>
</body>
</html>
